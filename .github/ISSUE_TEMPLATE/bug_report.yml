name: Bug report
description: Something the mod does that it should not
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        The mod is single-player only by design — it stands down completely on multiplayer servers. That is not a bug; see the README.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the mod did, and what you expected instead.
      placeholder: The catalog listed 64 iron in the barrel by the door, but taking it did nothing.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a fresh world if you can get it to happen there. If it only happens in one world, say what is unusual about it.
      placeholder: |
        1. Open a double chest and put 40 diamonds in the right-hand half
        2. Close it, press B, search "diamond"
        3. Click the hopper button
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: findmyitems version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minecraft, Fabric Loader and Fabric API versions
      placeholder: "MC 26.2, Loader 0.19.3, API 0.154.2"
    validations:
      required: true
  - type: textarea
    id: other-mods
    attributes:
      label: Other mods installed
      description: The whole list if it is short, the graphics and inventory ones if it is long. Rendering bugs in particular often turn out to belong to a shader or an inventory mod.
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: The relevant part of `logs/latest.log`, especially any stack trace. Automatically formatted as code.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: This happened in a single-player world
          required: true
        - label: I searched existing issues for the same problem
          required: true
