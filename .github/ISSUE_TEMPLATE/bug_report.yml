name: Bug report
description: Report behaviour that does not match what the documentation describes
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        The mod is active in single-player worlds only. It disables itself on multiplayer servers by design, so that is not a bug. See the README section "Single-player only".
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the mod did, and what you expected instead.
      placeholder: The catalog listed 64 iron ingots in a barrel, but retrieving them had no effect.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps starting from a new world where possible. If the problem occurs in only one world, describe what is different about it.
      placeholder: |
        1. Place a double chest and put 40 diamonds in its right half
        2. Open and close it
        3. Press B, search for "diamond"
        4. Click the hopper button
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: findmyitems version
      placeholder: "VERSION"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minecraft, Fabric Loader, and Fabric API versions
      placeholder: "Minecraft 26.2, Fabric Loader 0.19.3, Fabric API API_VERSION"
    validations:
      required: true
  - type: textarea
    id: other-mods
    attributes:
      label: Other installed mods
      description: The full list if it is short. Otherwise, list rendering and inventory mods, which are the most common source of interaction with this mod.
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Relevant lines from logs/latest.log, including any stack trace. This field is formatted as code automatically.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmation
      options:
        - label: This occurred in a single-player world
          required: true
        - label: I searched existing issues for the same problem
          required: true
