name: Feature request
description: Something the mod should do and does not
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What were you trying to do
      description: The situation in the world, not the feature. A described problem usually gets a better answer than a described solution.
      placeholder: I have eleven chests of building blocks and I can never remember which one has the deepslate.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: Optional. If you already have a shape for it, describe it here.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: Including "another mod does this" — knowing what already exists is useful.
